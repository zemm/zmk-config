# Uncomment the following lines to enable RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Found on reddit
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Cooperative priority so key scanning can't preempt a WS2812 frame mid-transfer
CONFIG_ZMK_LOW_PRIORITY_THREAD_PRIORITY=-1

# Initial settings for underglow
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=50
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=1
